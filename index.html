<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Economics Surplus Explorer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (UMD) -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
    
    <!-- Recharts (UMD) -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.2/umd/Recharts.js"></script>
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo, useEffect } = React;
      const { 
        ComposedChart, Line, Area, XAxis, YAxis, CartesianGrid, 
        Tooltip, ResponsiveContainer, ReferenceDot, Label 
      } = Recharts;

      // --- Inline Icons (Replacements for Lucide) ---
      const TrendingUp = ({ className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
      );

      // --- Component: Controls ---
      const SliderControl = ({ label, value, min, max, step, onChange, colorClass }) => (
        <div className="mb-4">
          <div className="flex justify-between mb-1">
            <label className="text-sm font-medium text-slate-700">{label}</label>
            <span className={`text-sm font-bold ${colorClass}`}>{value}</span>
          </div>
          <input
            type="range" min={min} max={max} step={step} value={value}
            onChange={(e) => onChange(parseFloat(e.target.value))}
            className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-slate-600 focus:outline-none focus:ring-2 focus:ring-slate-400"
          />
        </div>
      );

      const Controls = ({ params, onChange }) => {
        const updateParam = (key, value) => onChange({ ...params, [key]: value });
        return (
          <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h3 className="text-lg font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2">市场参数设置</h3>
            <div className="space-y-6">
              <div>
                <h4 className="text-blue-600 font-semibold mb-2 flex items-center">
                  <span className="w-3 h-3 bg-blue-600 rounded-full mr-2"></span>需求端 (Demand)
                </h4>
                <SliderControl label="支付意愿 (截距)" value={params.demandIntercept} min={50} max={200} step={5} onChange={(v) => updateParam('demandIntercept', v)} colorClass="text-blue-700" />
                <SliderControl label="价格敏感度 (斜率)" value={params.demandSlope} min={0.5} max={5} step={0.1} onChange={(v) => updateParam('demandSlope', v)} colorClass="text-blue-700" />
              </div>
              <div>
                <h4 className="text-red-600 font-semibold mb-2 flex items-center">
                   <span className="w-3 h-3 bg-red-600 rounded-full mr-2"></span>供给端 (Supply)
                </h4>
                <SliderControl label="基础成本 (截距)" value={params.supplyIntercept} min={0} max={50} step={2} onChange={(v) => updateParam('supplyIntercept', v)} colorClass="text-red-700" />
                <SliderControl label="生产扩展性 (斜率)" value={params.supplySlope} min={0.5} max={5} step={0.1} onChange={(v) => updateParam('supplySlope', v)} colorClass="text-red-700" />
              </div>
            </div>
          </div>
        );
      };

      // --- Component: StatsPanel ---
      const StatCard = ({ label, value, subValue, colorBg, colorText, borderColor }) => (
        <div className={`p-4 rounded-lg border ${borderColor} ${colorBg} flex flex-col justify-between`}>
          <span className={`text-sm font-semibold ${colorText} opacity-80 uppercase tracking-wider`}>{label}</span>
          <div className="mt-2">
            <span className={`text-2xl font-bold ${colorText}`}>{value}</span>
            {subValue && <span className={`block text-sm ${colorText} opacity-75`}>{subValue}</span>}
          </div>
        </div>
      );

      const StatsPanel = ({ data }) => (
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
          <StatCard label="市场价格" value={`$${data.eqPrice.toFixed(2)}`} colorBg="bg-slate-50" borderColor="border-slate-200" colorText="text-slate-700" />
          <StatCard label="交易数量" value={`${data.eqQuantity.toFixed(2)}`} colorBg="bg-slate-50" borderColor="border-slate-200" colorText="text-slate-700" />
          <StatCard label="消费者剩余" value={`$${data.consumerSurplus.toFixed(2)}`} subValue="(蓝色区域)" colorBg="bg-blue-50" borderColor="border-blue-200" colorText="text-blue-800" />
          <StatCard label="生产者剩余" value={`$${data.producerSurplus.toFixed(2)}`} subValue="(紫色区域)" colorBg="bg-purple-50" borderColor="border-purple-200" colorText="text-purple-800" />
        </div>
      );

      // --- Component: MarketChart ---
      const MarketChart = ({ params, marketData }) => {
        const { eqQuantity, eqPrice } = marketData;
        const data = useMemo(() => {
          const points = [];
          const maxQ = Math.max(eqQuantity * 1.5, 20);
          const step = maxQ / 50;
          const qValues = new Set();
          for (let q = 0; q <= maxQ; q += step) qValues.add(q);
          qValues.add(eqQuantity);
          const sortedQs = Array.from(qValues).sort((a, b) => a - b);
          sortedQs.forEach((q) => {
            const demandP = Math.max(0, params.demandIntercept - params.demandSlope * q);
            const supplyP = Math.max(0, params.supplyIntercept + params.supplySlope * q);
            const isLeftOfEq = q <= eqQuantity + 0.001;
            points.push({
              q: Number(q.toFixed(2)),
              demand: demandP > 0 ? Number(demandP.toFixed(2)) : null,
              supply: Number(supplyP.toFixed(2)),
              priceLine: Number(eqPrice.toFixed(2)),
              csArea: isLeftOfEq ? Number(demandP.toFixed(2)) : null,
              psArea: isLeftOfEq ? Number(supplyP.toFixed(2)) : null,
            });
          });
          return points;
        }, [params, eqQuantity, eqPrice]);

        return (
          <div className="w-full h-[400px] md:h-[500px] bg-white rounded-xl shadow-sm border border-slate-200 p-4">
            <ResponsiveContainer width="100%" height="100%">
              <ComposedChart data={data} margin={{ top: 20, right: 30, left: 10, bottom: 20 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                <XAxis dataKey="q" type="number" domain={[0, 'auto']} tick={{ fill: '#64748b' }}>
                  <Label value="数量 (Quantity)" offset={0} position="insideBottom" fill="#475569" />
                </XAxis>
                <YAxis domain={[0, 'auto']} tick={{ fill: '#64748b' }}>
                   <Label value="价格 (Price)" angle={-90} position="insideLeft" fill="#475569" style={{ textAnchor: 'middle' }} />
                </YAxis>
                <Tooltip contentStyle={{ backgroundColor: '#fff', borderRadius: '8px', border: '1px solid #e2e8f0' }} formatter={(value) => [`$${value}`, '']} labelFormatter={(label) => `数量: ${label}`} />
                <Area type="monotone" dataKey="csArea" stroke="none" fill="#3b82f6" fillOpacity={0.2} baseValue={eqPrice} name="消费者剩余 (Consumer Surplus)" isAnimationActive={false} />
                <Area type="monotone" dataKey="psArea" stroke="none" fill="#a855f7" fillOpacity={0.2} baseValue={eqPrice} name="生产者剩余 (Producer Surplus)" isAnimationActive={false} />
                <Line type="monotone" dataKey="demand" stroke="#2563eb" strokeWidth={3} dot={false} name="需求曲线" isAnimationActive={false} />
                <Line type="monotone" dataKey="supply" stroke="#ef4444" strokeWidth={3} dot={false} name="供给曲线" isAnimationActive={false} />
                <Line type="monotone" dataKey="priceLine" stroke="#64748b" strokeDasharray="5 5" strokeWidth={2} dot={false} name="均衡价格" activeDot={false} isAnimationActive={false} />
                <ReferenceDot x={eqQuantity} y={eqPrice} r={6} fill="#0f172a" stroke="#fff" strokeWidth={2} />
              </ComposedChart>
            </ResponsiveContainer>
          </div>
        );
      };

      // --- Main App ---
      const App = () => {
        const [params, setParams] = useState({ demandIntercept: 100, demandSlope: 1, supplyIntercept: 20, supplySlope: 1 });
        const marketData = useMemo(() => {
          const { demandIntercept, demandSlope, supplyIntercept, supplySlope } = params;
          const eqQuantity = (demandIntercept - supplyIntercept) / (demandSlope + supplySlope);
          const safeEqQuantity = Math.max(0, eqQuantity);
          const eqPrice = demandIntercept - demandSlope * safeEqQuantity;
          const csHeight = demandIntercept - eqPrice;
          const consumerSurplus = 0.5 * safeEqQuantity * csHeight;
          const psHeight = eqPrice - supplyIntercept;
          const producerSurplus = 0.5 * safeEqQuantity * psHeight;
          return { eqQuantity: safeEqQuantity, eqPrice, consumerSurplus: Math.max(0, consumerSurplus), producerSurplus: Math.max(0, producerSurplus), totalSurplus: Math.max(0, consumerSurplus + producerSurplus) };
        }, [params]);

        return (
          <div className="min-h-screen bg-slate-50 p-4 md:p-8">
            <div className="max-w-7xl mx-auto">
              <header className="mb-8">
                <div className="flex items-center space-x-3 mb-2">
                  <div className="bg-indigo-600 p-2 rounded-lg"><TrendingUp className="w-6 h-6 text-white" /></div>
                  <h1 className="text-3xl font-bold text-slate-900">经济学模拟器 (Economics Simulator)</h1>
                </div>
                <p className="text-slate-600 max-w-2xl">探索供给和需求的变化如何影响市场均衡和福利。 实时可视化<span className="text-blue-600 font-semibold">消费者剩余</span>和<span className="text-purple-600 font-semibold">生产者剩余</span>。</p>
              </header>
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-4 space-y-6">
                  <Controls params={params} onChange={setParams} />
                  <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 text-sm text-blue-900"><h4 className="font-semibold mb-1">小贴士：</h4><p>增加**支付意愿（需求截距）**可以模拟消费者收入增加或产品更受欢迎的情况。注意观察价格和交易数量是如何同时上升的。</p></div>
                </div>
                <div className="lg:col-span-8">
                  <StatsPanel data={marketData} />
                  <MarketChart params={params} marketData={marketData} />
                </div>
              </div>
            </div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<React.StrictMode><App /></React.StrictMode>);
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
